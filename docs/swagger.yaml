definitions:
  api.AuthInput:
    properties:
      password:
        example: password123
        type: string
      username:
        example: johndoe
        type: string
    required:
    - password
    - username
    type: object
  api.ErrorResponse:
    properties:
      details:
        example: Optional detailed error message
        type: string
      error:
        example: Description of the error
        type: string
    type: object
  api.SuccessResponse:
    properties:
      message:
        example: User created successfully
        type: string
    type: object
  api.TokenResponse:
    properties:
      token:
        example: your_jwt_token_here
        type: string
    type: object
  models.ErrorResponse:
    properties:
      details:
        example: Error details here
        type: string
      error:
        example: Invalid input
        type: string
    type: object
  models.SuccessResponse:
    properties:
      message:
        example: Event added successfully
        type: string
    type: object
info:
  contact: {}
paths:
  /api/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return a JWT token
      parameters:
      - description: User credentials
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/api.AuthInput'
      produces:
      - application/json
      responses:
        "200":
          description: JWT token
          schema:
            $ref: '#/definitions/api.TokenResponse'
        "400":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/material:
    post:
      consumes:
      - multipart/form-data
      description: Upload a material and save its metadata
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Material Name
        in: formData
        name: name
        required: true
        type: string
      - description: Material Description
        in: formData
        name: description
        required: true
        type: string
      - description: Faculty Name
        in: formData
        name: faculty_name
        required: true
        type: string
      - description: Subject Name
        in: formData
        name: subject_name
        required: true
        type: string
      - description: Year Name
        in: formData
        name: year_name
        required: true
        type: string
      - description: University Name
        in: formData
        name: university_name
        required: true
        type: string
      - description: Material File
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Material added successfully
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: AddMaterial
      tags:
      - materials
  /api/material/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve material details and file
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Material ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Material File
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: GetMaterial
      tags:
      - materials
  /api/signup:
    post:
      consumes:
      - application/json
      description: Create a new user with a username and password
      parameters:
      - description: User details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/api.AuthInput'
      produces:
      - application/json
      responses:
        "200":
          description: User created successfully
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Username already exists or invalid input
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: CreateUser
      tags:
      - auth
swagger: "2.0"
