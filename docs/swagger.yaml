          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/material:
    post:
      consumes:
      - multipart/form-data
      description: Upload a material and save its metadata
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Material Name
        in: formData
        name: name
        required: true
        type: string
      - description: Material Description
        in: formData
        name: description
        required: true
        type: string
      - description: Faculty Name
        in: formData
        name: faculty_name
        required: true
        type: string
      - description: Subject Name
        in: formData
        name: subject_name
        required: true
        type: string
      - description: Year Name
        in: formData
        name: year_name
        required: true
        type: string
      - description: University Name
        in: formData
        name: university_name
        required: true
        type: string
      - description: Material File
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Material added successfully
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: AddMaterial
      tags:
      - materials
  /api/material/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve material details and file
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Material ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Material File
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: GetMaterial
      tags:
      - materials
