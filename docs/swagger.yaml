definitions:
  api.AuthInput:
    properties:
      password:
        example: password123
        type: string
      username:
        example: johndoe
        type: string
    required:
    - password
    - username
    type: object
  api.ErrorResponse:
    properties:
      details:
        example: Optional detailed error message
        type: string
      error:
        example: Description of the error
        type: string
    type: object
  api.SuccessResponse:
    properties:
      message:
        example: User created successfully
        type: string
    type: object
  api.TokenResponse:
    properties:
      token:
        example: your_jwt_token_here
        type: string
    type: object
  models.ErrorResponse:
    properties:
      details:
        example: Error details here
        type: string
      error:
        example: Invalid input
        type: string
    type: object
  models.Faculty:
    properties:
      id:
        description: Используяется только в GET
        type: integer
      name:
        example: Engineering
        type: string
      university_id:
        type: integer
    type: object
  models.Subject:
    properties:
      id:
        description: Используяется только в GET
        type: integer
      name:
        example: Mathematics
        type: string
    type: object
  models.SuccessResponse:
    properties:
      message:
        example: Event added successfully
        type: string
    type: object
  models.University:
    properties:
      id:
        description: Используяется только в GET
        type: integer
      name:
        example: Harvard University
        type: string
    type: object
  models.Year:
    properties:
      id:
        description: Используяется только в GET
        type: integer
      name:
        example: "2024"
        type: string
    type: object
info:
  contact: {}
paths:
  /api/faculties:
    get:
      consumes:
      - application/json
      description: Retrieve all faculties
      produces:
      - application/json
      responses:
        "200":
          description: List of faculties
          schema:
            items:
              $ref: '#/definitions/models.Faculty'
            type: array
        "500":
          description: Could not retrieve faculties
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: GetFaculties
      tags:
      - faculties
  /api/faculty:
    post:
      consumes:
      - application/json
      description: Add a new faculty
      parameters:
      - description: Faculty
        in: body
        name: faculty
        required: true
        schema:
          $ref: '#/definitions/models.Faculty'
      produces:
      - application/json
      responses:
        "200":
          description: Faculty added successfully
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: AddFaculty
      tags:
      - faculties
  /api/faculty/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a single faculty by its ID
      parameters:
      - description: Faculty ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Faculty details
          schema:
            $ref: '#/definitions/models.Faculty'
        "400":
          description: Invalid faculty ID
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Could not retrieve faculty
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: GetFaculty
      tags:
      - faculties
  /api/faculty/name/{name}:
